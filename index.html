<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Message</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(45deg, WHITE, GRAY, WHITE);
            font-family: Arial, sans-serif;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        h1 {
            font-size: 30px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        input, button {
            margin-top: 20px;
            font-size: 18px;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1 id="text"></h1>
    <input type="text" id="response" placeholder="Yes or No?">
    <button onclick="submitResponse()">Send</button>
    
    <script>
        const text = "IT'S SUNNY! WE ARE GOING OUT!";
        let index = 0;
        function showText() {
            if (index < text.length) {
                document.getElementById("text").innerHTML += text[index];
                document.getElementById("text").style.opacity = 1;
                index++;
                setTimeout(showText, 150);
            }
        }
        
      function submitResponse() {
    let response = document.getElementById("response").value.trim().toLowerCase();

    localStorage.setItem("userResponse", response);

    if (response === "yes") {
        window.location.href = "response.html";
    } 
    else if (response === "no") {
        window.location.href = "response2.html";
    } 
    else {
        alert("Please type Yes or No.");
    }
}
        
        window.onload = showText;
    </script>
